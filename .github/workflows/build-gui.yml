name: build-gui

# Builds release archives for Linux, Windows and macOS on every push to main,
# and publishes them as GitHub Release assets when a v* tag is pushed.
#
# The Windows build is also committed back to main (playlist2mp3-gui.exe + bin/)
# so that downloading the repo gives a runnable app with no build step. That
# refresh runs on a v* tag and on a manual run with commit_bundle=true:
#
# Manual run:            gh workflow run build-gui
# Refresh the bundle:    gh workflow run build-gui -f commit_bundle=true
# Release:               git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      commit_bundle:
        description: "Rebuild and commit playlist2mp3-gui.exe + bin/ to main"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            script: bash packaging/build_linux.sh
            artifact: playlist2mp3-gui-linux-x64.tar.gz
          - name: windows-x64
            os: windows-latest
            script: pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/build_windows.ps1
            artifact: playlist2mp3-gui-windows-x64.zip
          # macos-14 runners are Apple Silicon (arm64).
          - name: macos-arm64
            os: macos-14
            script: bash packaging/build_macos.sh
            artifact: playlist2mp3-gui-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.0"
          fi
          echo "P2M_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building playlist2mp3 $version"

      - name: Build release archive
        shell: bash
        run: ${{ matrix.script }}

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          # Archives are already compressed.
          compression-level: 0

      # The repo ships the Windows app so a plain download runs on Windows.
      # Keep that copy in sync with what this build produced.
      - name: Refresh the committed Windows bundle
        if: >-
          matrix.name == 'windows-x64' &&
          (startsWith(github.ref, 'refs/tags/v') || inputs.commit_bundle == true)
        shell: bash
        run: |
          set -euo pipefail
          src="dist/playlist2mp3-gui-windows-x64"
          cp "$src/playlist2mp3-gui.exe" playlist2mp3-gui.exe
          rm -rf bin
          cp -r "$src/bin" bin

          git add -A -- playlist2mp3-gui.exe bin
          if git diff --cached --quiet; then
            echo "committed bundle is already up to date"
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Refresh the committed Windows bundle ($P2M_VERSION)

          Built by the build-gui workflow from ${GITHUB_REF_NAME}."
          git push origin HEAD:main

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "playlist2mp3 $TAG" \
              --generate-notes
          fi
